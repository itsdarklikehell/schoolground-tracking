<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schoolground Tracking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #00d4ff; }
        .map-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,212,255,0.2);
        }
        .map-wrapper iframe { 
            width: 100%; 
            height: 500px; 
            border: 0;
        }
        .info-panel {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
            border: 1px solid #0f3460;
        }
        .info-panel h2 { color: #00d4ff; margin-bottom: 10px; font-size: 1.1em; }
        .info-panel p { color: #a0a0a0; line-height: 1.6; }
        .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.85em; margin-top: 8px; }
        .status.active { background: #00d4ff22; color: #00d4ff; border: 1px solid #00d4ff44; }
        .status.inactive { background: #ff444422; color: #ff4444; border: 1px solid #ff444444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Schoolground Tracking</h1>
        <div class="map-wrapper">
            <iframe 
                src="https://maps.google.com/maps?q=university%20of%20san%20francisco&t=k&z=11&ie=UTF8&iwloc=&output=embed" 
                allowfullscreen 
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
        <div class="info-panel">
            <h2>Over dit project</h2>
            <p>Track users and display them on a map to navigate and such.</p>
            <span class="status active">Actief</span>
        </div>
    </div>
</body>
</html>
